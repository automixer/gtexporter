name: build_branch

on:
  workflow_dispatch:

jobs:
  build_branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ github.repository }}
          labels: |
            org.opencontainers.image.ref.name=${{ github.repository }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive Go version from go.mod
        run: |
          if grep -qE '^toolchain[[:space:]]+go[0-9]+\.[0-9]+(\.[0-9]+)?' go.mod; then
            # Extract "go1.x.y" -> "1.x.y"
            VER=$(awk '/^toolchain[[:space:]]+go/{print $2}' go.mod)
            echo "GO_VERSION=${VER#go}" >> "$GITHUB_ENV"
          else
            # Extract "go 1.x.y" or "go 1.x"
            echo "GO_VERSION=$(awk '/^go[[:space:]]+/{print $2}' go.mod)" >> "$GITHUB_ENV"
          fi
          echo "Using Go version: $GO_VERSION"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: "${{ github.repository }}:${{ github.ref_name }}"
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MODE=docker_release
            GO_VERSION=${{ env.GO_VERSION }}
